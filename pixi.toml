[workspace]
name = "calculix"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
c-compiler = "*"
fortran-compiler = "*"
make = "*"
openblas = "*"
arpack = { version = "*", build = "nompi_*" }
spooles = "*"

[tasks]
build = "make -f Makefile.pixi -j8"
clean = "make -f Makefile.pixi clean"
smoke = { cmd = "sh scripts/smoke-pixi.sh", depends-on = ["build"] }
bench = { cmd = "python3.12 bench/block.py", depends-on = ["build"] }
bench-quick = { cmd = "python3.12 bench/block.py quick", depends-on = ["build"] }
bench-sweep = { cmd = "python3.12 bench/block.py --sweep", depends-on = ["build"] }
